<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HIGHSKOOL Games</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap">
<style>
  :root { --hall: #0a0714; --ink: #f4f1ff; --muted: #9a94c2; --line: #3a2f66; --accent: #ffd43b; --accent-dark: #c99a00; --accent-ink: #1b1b2a; --px: 4px; }
  html, body { height: 100%; }
  body { margin: 0; min-height: 100%; background: var(--hall); color: var(--ink); font-family: "DotGothic16", "Press Start 2P", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; position: relative; overflow-x: hidden; image-rendering: pixelated; }
  body::after { content: ""; position: fixed; inset: 0; z-index: 2; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0 2px, transparent 2px 4px); }
  .backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: url("whack/images/bg.png") center top / cover no-repeat var(--hall); image-rendering: pixelated; }
  main { position: relative; z-index: 1; width: 100%; max-width: 520px; text-align: center; }
  h1 { margin: 0 0 8px; font-family: "Press Start 2P", monospace; font-size: clamp(16px, 5vw, 24px); line-height: 1.5; text-shadow: 3px 3px 0 var(--accent-dark), 6px 6px 0 #000; }
  .sub { margin: 0 0 32px; color: var(--muted); letter-spacing: 0.15em; text-shadow: 2px 2px 0 #000; }
  .games { display: grid; gap: 20px; }
  a.game { display: block; text-decoration: none; color: var(--ink); background: rgba(19, 13, 38, 0.92); padding: 22px 20px; border: 0;
    box-shadow: 0 calc(var(--px) * -1) 0 0 var(--line), 0 var(--px) 0 0 var(--line), calc(var(--px) * -1) 0 0 0 var(--line), var(--px) 0 0 0 var(--line); }
  a.game:hover, a.game:focus-visible { --line: var(--accent); outline: none; }
  a.game .name { font-family: "Press Start 2P", monospace; font-size: clamp(12px, 3.5vw, 16px); color: var(--accent); text-shadow: 2px 2px 0 #000; line-height: 1.6; }
  a.game .desc { margin-top: 10px; color: var(--muted); font-size: 14px; line-height: 1.6; }
  a.game .go { display: inline-block; margin-top: 14px; font-family: "Press Start 2P", monospace; font-size: 11px; background: var(--accent); color: var(--accent-ink); padding: 12px 18px; box-shadow: inset -4px -4px 0 0 var(--accent-dark), 4px 4px 0 0 #000; }
  footer { position: relative; z-index: 1; margin-top: 36px; text-align: center; font-family: "Press Start 2P", monospace; font-size: 10px; letter-spacing: 0.15em; line-height: 1.8; color: var(--muted); text-shadow: 2px 2px 0 #000; }
  footer b { color: var(--accent); font-weight: normal; }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<main>
  <h1>HIGHSKOOL<br>GAMES</h1>
  <p class="sub">EPIK HIGH · PIXEL ARCADE</p>
  <div class="games">
    <a class="game" href="memory/">
      <div class="name">Epik High 짝 맞추기</div>
      <div class="desc">앨범 커버 카드 짝 맞추기 · 2×2 → 4×4 → 6×6 세 라운드</div>
      <span class="go">PLAY</span>
    </a>
    <a class="game" href="whack/">
      <div class="name">박규봉 잡기</div>
      <div class="desc">화분에서 올라오는 박규봉을 탭! · 30초 3단계</div>
      <span class="go">PLAY</span>
    </a>
  </div>
</main>
<footer>MADE BY <b>FreeLove</b><br>FOR HIGHSKOOL · 2026</footer>
</body>
</html>
